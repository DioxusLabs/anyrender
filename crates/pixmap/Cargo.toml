[package]
name = "pixmap"
description = "A minimal owned pixel buffer shared by AnyRender's glyph and atlas crates"
version = "0.1.0"
documentation = "https://docs.rs/pixmap"
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = []
blend = []
resample = []
transform = []
png = ["dep:png"]

[dependencies]
png = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
vello_common = { workspace = true }
vello_cpu = { workspace = true }

[[bench]]
name = "vs_vello_cpu"
harness = false
required-features = ["blend", "resample", "transform"]

[package.metadata.docs.rs]
all-features = true
