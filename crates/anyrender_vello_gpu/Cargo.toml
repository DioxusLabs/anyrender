[package]
name = "anyrender_vello_gpu"
description = "vello_gpu (formerly vello_hybrid) backend for anyrender"
version = "0.12.0"
documentation = "https://docs.rs/anyrender_vello_gpu"
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[features]
log_frame_times = ["debug_timer/enable"]
webgl = [
  "vello_gpu/webgl",
  "dep:web-sys",
  "dep:wasm-bindgen",
  "dep:raw-window-handle",
]

[dependencies]
anyrender = { workspace = true }
debug_timer = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
vello_gpu = { workspace = true }
vello_common = { workspace = true }
anyrender_glyph = { workspace = true, features = ["png"] }
anyrender_atlas = { workspace = true }
pixmap = { workspace = true }
vello_cpu = { workspace = true }
bytemuck = "1"
wgpu = { workspace = true }
rustc-hash = { workspace = true }
wgpu_context = { workspace = true }
futures-channel = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
  "Document",
  "Element",
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "WebGlTexture",
  "console",
  "Window",
] }
[dev-dependencies]
skrifa = { workspace = true }
