[package]
name = "anyrender_atlas"
description = "A texture atlas with shelf packing, padding and least-recently-used eviction"
version = "0.1.0"
documentation = "https://docs.rs/anyrender_atlas"
repository.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
pixmap = { workspace = true }
etagere = "0.3"
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher"] }
