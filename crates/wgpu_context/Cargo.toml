[package]
name = "wgpu_context"
description = "Context for managing WGPU surfaces"
version = "0.10.0"
documentation = "https://docs.rs/wgpu_context"
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
wgpu = { workspace = true }
futures-intrusive = { workspace = true }
log = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColorSpace"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "CALayer", "CAMetalLayer"] }
