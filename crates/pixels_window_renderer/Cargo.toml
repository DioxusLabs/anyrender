[package]
name = "pixels_window_renderer"
description = "AnyRender WindowRenderer backed by the pixels crate"
version = "0.9.0"
documentation = "https://docs.rs/pixels_window_renderer"
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true

[features]
log_frame_times = ["debug_timer/enable"]

[dependencies]
anyrender = { workspace = true }
debug_timer = { workspace = true }
pixels = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = { workspace = true }
objc2 = { version = "0.6.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-quartz-core", "NSView", "NSResponder"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColorSpace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "CALayer", "CAMetalLayer"] }
